<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>輸入結帳資訊</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/all.min.css" />
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10">
        <nav class="navbar navbar-expand-lg navbar-light bg-white mt-n1 py-2 px-3 z-1" style="margin: 0 -0.75rem;">
          <a class="navbar-brand" href="./index.html">
            <img class="img-fluid" style="width: 3.75rem; height: 3.75rem;" src="./assets/images/logo.webp" alt="logo">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-item nav-link me-4" href="./product.html">產品列表</a>
              <a class="d-md-none nav-item nav-link" href="./cart.html">購物車</a>
              <a class="d-none d-md-block nav-item nav-link" href="./cart.html"><i class="fas fa-shopping-cart"></i></a>
            </div>
          </div>
        </nav>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-10">
        <h3 class="fw-bold mb-4 pt-3">輸入結帳資訊</h3>
      </div>
    </div>
    <div class="row flex-row-reverse justify-content-center pb-5">
      <div class="col-md-4">
        <div class="border p-4 mb-4">
          <div class="d-flex">
            <img
              src="https://images.unsplash.com/photo-1631122750867-6cfee01358b5?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8QmlyZCUyMG9mJTIwUGFyYWRpc2V8ZW58MHwwfDB8fHwy"
              alt="" class="me-2" style="width: 48px; height: 48px; object-fit: cover">
            <div class="w-100">
              <div class="d-flex justify-content-between">
                <p class="mb-0 fw-bold">天堂鳥蕉</p>
                <p class="mb-0">NT$12,000</p>
              </div>
              <p class="mb-0 fw-bold">x1</p>
            </div>
          </div>
          <div class="d-flex mt-2">
            <img
              src="https://images.unsplash.com/photo-1680812992886-6231db0dabeb?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt="" class="me-2" style="width: 48px; height: 48px; object-fit: cover">
            <div class="w-100">
              <div class="d-flex justify-content-between">
                <p class="mb-0 fw-bold">石蓮花</p>
                <p class="mb-0">NT$12,000</p>
              </div>
              <p class="mb-0 fw-bold">x1</p>
            </div>
          </div>
          <table class="table mt-4 border-top border-bottom text-muted">
            <tbody>
              <tr>
                <th scope="row" class="border-0 px-0 pt-4 font-weight-normal">小計</th>
                <td class="text-end border-0 px-0 pt-4">NT$24,000</td>
              </tr>
              <tr>
                <th scope="row" class="border-0 px-0 pt-0 pb-4 font-weight-normal">付款方式</th>
                <td class="text-end border-0 px-0 pt-0 pb-4">ApplePay</td>
              </tr>
            </tbody>
          </table>
          <div class="d-flex justify-content-between mt-4">
            <p class="mb-0 h4 fw-bold">總計</p>
            <p class="mb-0 h4 fw-bold">NT$24,000</p>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <form>
          <div class="mb-2">
            <label for="ContactMail" class="text-muted mb-0">電子信箱</label>
            <input type="email" class="form-control" id="ContactMail" aria-describedby="emailHelp"
              placeholder="example@gmail.com">
          </div>
          <div class="mb-2">
            <label for="ContactName" class="text-muted mb-0">姓名</label>
            <input type="text" class="form-control" id="ContactName" placeholder="王漂亮">
          </div>
          <div class="mb-2">
            <label for="ContactPhone" class="text-muted mb-0">手機</label>
            <input type="text" class="form-control" id="ContactPhone" placeholder="0912345678">
          </div>
          <div class="mb-2">
            <label for="ContactMessage" class="text-muted mb-0">留言</label>
            <textarea class="form-control" rows="3" id="ContactMessage"
              placeholder="六角學院，只要你不放棄，我們就不放棄你 ... "></textarea>
          </div>
        </form>
        <div
          class="d-flex flex-column-reverse flex-md-row mt-4 justify-content-between align-items-md-center align-items-end w-100">
          <a href="./cart.html" class="text-dark mt-md-0 mt-3"><i class="fas fa-chevron-left me-2"></i>返回</a>
          <button type="button" class="btn btn-dark py-3 px-7">結帳</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
  integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.min.js"
  integrity="sha384-Atwg2Pkwv9vp0ygtn1JAojH0nYbwNJLPhwyoVbhoPwBhjQPR5VtM2+xf0Uwh9KtT" crossorigin="anonymous"></script>
</body>

</html>
